{% extends 'base/base.html' %}

{% block title %}Mapa de Sedes — SIGCU Bolivia{% endblock %}

{% block content %}
<div class="row mb-3">
  <div class="col">
    <h4>Mapa de Sedes Universitarias — Bolivia</h4>
    <p class="text-muted">Sedes con coordenadas registradas aparecen como marcadores.</p>
  </div>
</div>

<div id="mapa" style="height: 560px; border-radius: 8px; border: 1px solid #ccc;"></div>
{% endblock %}

{% block scripts %}
<script>
  const map = L.map('mapa').setView([-16.5, -64.5], 6);

  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_3ni7_1_8c4972bd350b5b36d24741b6',
    {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }
).addTo(map);

  fetch('/api/v1/universidades/sedes/geojson/')
    .then(r => r.json())
    .then(data => {
      L.geoJSON(data, {
        onEachFeature: function(feature, layer) {
          const p = feature.properties;
          layer.bindPopup(
            `<b>${p.facultad}</b><br>
             ${p.universidad} — ${p.ciudad}<br>
             Tel: ${p.telefono || 'No registrado'}`
          );
        }
      }).addTo(map);
    })
    .catch(() => {
      document.getElementById('mapa').innerHTML =
        '<div class="alert alert-warning m-3">No se pudo cargar el mapa.</div>';
    });
</script>
{% endblock %}
