{% extends 'base/base.html' %}
{% block title %}Rechazar Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card border-danger shadow">
      <div class="card-header bg-danger text-white">
        <strong>Confirmar rechazo</strong>
      </div>
      <div class="card-body">
        <p>¿Estás seguro de rechazar y eliminar la solicitud de
          <strong>{{ usuario.get_full_name }}</strong>?</p>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Sí, rechazar</button>
            <a href="{% url 'panel-admin-usuarios' %}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
